<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>單車 IG 限動視覺化生成器</title>
  <style>
    body {
      margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212; color: #fff; display: flex; gap: 24px;
    }
    .panel { width: 340px; display: flex; flex-direction: column; gap: 14px; }
    .control-group { background: #1e1e1e; padding: 14px; border-radius: 8px; font-size: 14px; }
    .control-group label { display: block; margin-bottom: 6px; font-weight: bold; }
    .checkbox-group label { display: flex; align-items: center; gap: 8px; font-weight: normal; margin-bottom: 6px; cursor: pointer; }
    input[type="range"], select { width: 100%; }
    button {
      background: #fc5200; color: #fff; border: none; padding: 10px 14px;
      border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 6px;
    }
    button:disabled { background: #555; cursor: not-allowed; }
    #preview-container {
      position: relative; width: 360px; height: 640px;
      border-radius: 16px; overflow: hidden; background: #000; border: 2px solid #333;
    }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <div class="panel">
    <div class="control-group">
      <label>1. 匯入活動檔案</label>
      <input type="file" id="tcxInput" accept=".tcx" />
      <div id="status" style="margin-top: 6px; color: #aaa; font-size: 12px;">支援 Garmin .tcx 檔案</div>
    </div>

    <div class="control-group checkbox-group">
      <label>2. 自訂 HUD 儀表顯示</label>
      <label><input type="checkbox" id="showSpeed" checked> 即時時速 (Speed)</label>
      <label><input type="checkbox" id="showHR" checked> 即時心率 (Heart Rate)</label>
      <label><input type="checkbox" id="showElevation" checked> 當前海拔 (Altitude)</label>
      <label><input type="checkbox" id="showProgress" checked> 總里程與百分比進度條</label>
    </div>

    <div class="control-group">
      <label>3. 影片播放長度: <span id="durationVal">15</span> 秒</label>
      <input type="range" id="durationSlider" min="5" max="60" value="15" />
    </div>

    <div class="control-group">
      <label>4. 操作</label>
      <button id="btnPlay" disabled>播放預覽</button>
      <button id="btnRecord" disabled style="background:#28a745;">錄製並下載 IG 限動 (WebM)</button>
    </div>
  </div>

  <div id="preview-container">
    <canvas id="exportCanvas" width="720" height="1280"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('exportCanvas');
    const ctx = canvas.getContext('2d');
    let rawPoints = [];
    let trackPoints = [];
    let isPlaying = false;
    let bounds = { minX: 0, maxX: 0, minY: 0, maxY: 0 };

    document.getElementById('tcxInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        rawPoints = parseTCX(evt.target.result);
        if (rawPoints.length > 0) {
          // 資料抽樣降維：保留上限約 1500 點，確保 60 FPS 流暢度
          trackPoints = downsample(rawPoints, 1500);
          calculateBounds();
          document.getElementById('status').innerText = `原始: ${rawPoints.length} 點 -> 最佳化: ${trackPoints.length} 點`;
          document.getElementById('btnPlay').disabled = false;
          document.getElementById('btnRecord').disabled = false;
          drawFrame(0);
        }
      };
      reader.readAsText(file);
    });

    // 抽樣算法：固定步長縮減
    function downsample(arr, targetCount) {
      if (arr.length <= targetCount) return arr;
      const step = Math.ceil(arr.length / targetCount);
      const sampled = [];
      for (let i = 0; i < arr.length; i += step) {
        sampled.push(arr[i]);
      }
      sampled.push(arr[arr.length - 1]);
      return sampled;
    }

    function parseTCX(xmlStr) {
      const xml = new DOMParser().parseFromString(xmlStr, "application/xml");
      const nodes = xml.getElementsByTagName("Trackpoint");
      const list = [];
      let totalDist = 0;

      for (let i = 0; i < nodes.length; i++) {
        const lat = nodes[i].getElementsByTagName("LatitudeDegrees")[0];
        const lon = nodes[i].getElementsByTagName("LongitudeDegrees")[0];
        const alt = nodes[i].getElementsByTagName("AltitudeMeters")[0];
        const hr = nodes[i].getElementsByTagName("HeartRateBpm")[0];

        if (lat && lon) {
          const pt = {
            lat: parseFloat(lat.textContent),
            lon: parseFloat(lon.textContent),
            alt: alt ? Math.round(parseFloat(alt.textContent)) : 0,
            hr: hr ? parseInt(hr.querySelector("Value").textContent, 10) : 0,
            speed: 0
          };
          if (list.length > 0) {
            const prev = list[list.length - 1];
            const d = getDistKm(prev.lat, prev.lon, pt.lat, pt.lon);
            totalDist += d;
            pt.dist = totalDist;
            pt.speed = Math.round(d * 3600);
          } else {
            pt.dist = 0;
          }
          list.push(pt);
        }
      }
      return list;
    }

    function getDistKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 計算自適應畫布縮放邊界（自動填滿 9:16）
    function calculateBounds() {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      trackPoints.forEach(p => {
        if (p.lon < minX) minX = p.lon;
        if (p.lon > maxX) maxX = p.lon;
        if (p.lat < minY) minY = p.lat;
        if (p.lat > maxY) maxY = p.lat;
      });
      bounds = { minX, maxX, minY, maxY };
    }

    function project(p) {
      const padding = 80;
      const drawW = canvas.width - padding * 2;
      const drawH = canvas.height - 350; // 下方保留空間給 HUD

      const scaleX = drawW / (bounds.maxX - bounds.minX || 1);
      const scaleY = drawH / (bounds.maxY - bounds.minY || 1);
      const scale = Math.min(scaleX, scaleY);

      const x = padding + (p.lon - bounds.minX) * scale + (drawW - (bounds.maxX - bounds.minX) * scale) / 2;
      const y = 200 + (bounds.maxY - p.lat) * scale;
      return { x, y };
    }

    function drawFrame(currentIdx) {
      ctx.fillStyle = '#0f141c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!trackPoints.length) return;

      // 1. 底層灰色全路徑虛線（預覽路線）
      ctx.beginPath();
      ctx.strokeStyle = '#223040';
      ctx.lineWidth = 4;
      trackPoints.forEach((p, i) => {
        const pos = project(p);
        if (i === 0) ctx.moveTo(pos.x, pos.y);
        else ctx.lineTo(pos.x, pos.y);
      });
      ctx.stroke();

      // 2. 騎乘過的亮橘色高光軌跡（Strava 橘）
      ctx.beginPath();
      ctx.strokeStyle = '#fc5200';
      ctx.lineWidth = 6;
      ctx.shadowColor = 'rgba(252, 82, 0, 0.6)';
      ctx.shadowBlur = 12;
      for (let i = 0; i <= currentIdx; i++) {
        const pos = project(trackPoints[i]);
        if (i === 0) ctx.moveTo(pos.x, pos.y);
        else ctx.lineTo(pos.x, pos.y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0; // 重設發光

      // 3. 車頭動態亮點
      const curPt = trackPoints[currentIdx];
      const curPos = project(curPt);
      ctx.beginPath();
      ctx.arc(curPos.x, curPos.y, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#fc5200';
      ctx.stroke();

      // 4. 繪製 HUD
      drawHUD(curPt);
    }

    function drawHUD(pt) {
      const showSpeed = document.getElementById('showSpeed').checked;
      const showHR = document.getElementById('showHR').checked;
      const showElev = document.getElementById('showElevation').checked;
      const showProg = document.getElementById('showProgress').checked;

      // 頂部進度卡
      if (showProg) {
        const total = trackPoints[trackPoints.length - 1].dist || 1;
        const current = pt.dist || 0;
        const pct = Math.min(100, Math.round((current / total) * 100));

        ctx.fillStyle = 'rgba(25, 30, 40, 0.85)';
        ctx.roundRect(40, 60, canvas.width - 80, 90, 16);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 32px sans-serif';
        ctx.fillText(`${current.toFixed(1)} km`, 70, 118);

        ctx.fillStyle = '#8899a6';
        ctx.font = '22px sans-serif';
        ctx.fillText(`/ ${total.toFixed(1)} km (${pct}%)`, 240, 118);
      }

      // 底部 HUD 模組
      const hudItems = [];
      if (showSpeed) hudItems.push({ label: 'SPEED', val: `${pt.speed > 85 ? '--' : pt.speed}`, unit: 'km/h' });
      if (showHR) hudItems.push({ label: 'HEART RATE', val: `${pt.hr || '--'}`, unit: 'bpm', alert: pt.hr > 165 });
      if (showElev) hudItems.push({ label: 'ELEVATION', val: `${pt.alt}`, unit: 'm' });

      if (hudItems.length > 0) {
        const hudY = canvas.height - 180;
        const blockWidth = (canvas.width - 80) / hudItems.length;

        ctx.fillStyle = 'rgba(25, 30, 40, 0.9)';
        ctx.roundRect(40, hudY, canvas.width - 80, 110, 20);
        ctx.fill();

        hudItems.forEach((item, i) => {
          const itemX = 60 + (i * blockWidth);
          ctx.fillStyle = '#718096';
          ctx.font = 'bold 16px sans-serif';
          ctx.fillText(item.label, itemX, hudY + 36);

          ctx.fillStyle = item.alert ? '#ff4d4f' : '#ffffff';
          ctx.font = 'bold 36px sans-serif';
          ctx.fillText(item.val, itemX, hudY + 82);

          ctx.fillStyle = '#718096';
          ctx.font = '16px sans-serif';
          ctx.fillText(item.unit, itemX + (item.val.length * 22) + 6, hudY + 82);
        });
      }
    }

    function animate(onComplete) {
      if (isPlaying) return;
      isPlaying = true;
      const duration = parseInt(document.getElementById('durationSlider').value, 10) * 1000;
      const startTime = performance.now();
      const count = trackPoints.length;

      function loop(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const idx = Math.floor(progress * (count - 1));

        drawFrame(idx);

        if (progress < 1) {
          requestAnimationFrame(loop);
        } else {
          isPlaying = false;
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(loop);
    }

    document.getElementById('btnPlay').addEventListener('click', () => animate());

    document.getElementById('btnRecord').addEventListener('click', function() {
      const btn = this;
      btn.disabled = true;
      btn.innerText = '正在錄製中...';

      const stream = canvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      const chunks = [];

      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ride_story_${Date.now()}.webm`;
        a.click();
        btn.disabled = false;
        btn.innerText = '錄製並下載 IG 限動 (WebM)';
      };

      recorder.start();
      animate(() => recorder.stop());
    });

    document.getElementById('durationSlider').addEventListener('input', e => {
      document.getElementById('durationVal').innerText = e.target.value;
    });
  </script>
</body>
</html>
