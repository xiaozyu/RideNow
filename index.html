<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>RideNow - 單車動態視覺化</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fit-file-parser@1.6.0/dist/fit-file-parser.min.js"></script>
  <style>
    body {
      margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #121212; color: #fff; display: flex; gap: 24px;
    }
    .panel { width: 340px; display: flex; flex-direction: column; gap: 14px; }
    .control-group { background: #1e1e1e; padding: 14px; border-radius: 8px; font-size: 14px; }
    .control-group label { display: block; margin-bottom: 6px; font-weight: bold; }
    .checkbox-group label { display: flex; align-items: center; gap: 8px; font-weight: normal; margin-bottom: 6px; cursor: pointer; }
    input[type="range"] { width: 100%; accent-color: #fc5200; }
    button {
      background: #fc5200; color: #fff; border: none; padding: 10px 14px;
      border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 6px;
    }
    button:disabled { background: #555; cursor: not-allowed; }

    #render-container {
      position: relative; width: 360px; height: 640px;
      border-radius: 16px; overflow: hidden; background: #000; border: 2px solid #333;
    }
    #map { width: 100%; height: 100%; }

    .hud-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
      padding: 16px; box-sizing: border-box; z-index: 10;
    }
    
    .hud-top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
    .hud-top {
      background: rgba(18, 18, 18, 0.88); backdrop-filter: blur(8px);
      padding: 10px 14px; border-radius: 12px; display: flex; flex-direction: column; gap: 6px;
      min-width: 170px;
    }
    .hud-top-line { display: flex; align-items: baseline; gap: 8px; }
    .hud-top .dist { font-size: 22px; font-weight: bold; color: #fff; }
    .hud-top .pct { font-size: 13px; color: #888; }
    .hud-top .sub { display: flex; gap: 8px; font-size: 12px; }
    .hud-top .city { color: #fc5200; font-weight: bold; }
    .hud-top .time { color: #aaa; }

    .progress-track {
      width: 100%; height: 4px; background: rgba(255, 255, 255, 0.2);
      border-radius: 2px; overflow: hidden; margin-top: 2px;
    }
    .progress-fill {
      height: 100%; width: 0%; background: #fc5200;
      transition: width 0.05s linear;
    }
    
    .minimap-card {
      width: 80px; height: 130px; background: rgba(18, 18, 18, 0.88);
      backdrop-filter: blur(8px); border-radius: 10px; border: 1px solid #333;
      padding: 4px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    }
    #minimapCanvas { width: 100%; height: 100%; display: block; }

    .rest-marker-container {
      display: flex; align-items: center; pointer-events: auto; cursor: pointer;
      transform: translate(-6px, -6px);
    }
    .rest-dot {
      width: 10px; height: 10px; background: #00ffff; border: 2px solid #ffffff;
      border-radius: 50%; box-shadow: 0 0 8px #00ffff; flex-shrink: 0;
    }
    .rest-tag {
      margin-left: 6px; background: rgba(5, 17, 30, 0.9); border: 1px solid #00ffff;
      color: #ffffff; font-size: 11px; font-weight: bold; padding: 2px 6px;
      border-radius: 4px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .rest-marker-container:hover .rest-tag {
      background: #00ffff; color: #000;
    }

    #streetviewModal {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 500;
    }
    #svFrame { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; z-index: 501; }
    
    .sv-navbar {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(18, 18, 18, 0.92); backdrop-filter: blur(8px);
      padding: 8px 12px; border-radius: 10px; border: 1px solid #444; z-index: 9999;
    }
    .sv-title { font-size: 13px; font-weight: bold; color: #00ffff; }
    .sv-nav-btns { display: flex; gap: 6px; }
    .sv-nav-btn {
      background: #2a2a2a; color: #fff; border: 1px solid #555;
      padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .sv-nav-btn:hover { background: #fc5200; border-color: #fc5200; }
    .sv-close-btn {
      background: #d93025; color: #fff; border: none; padding: 4px 10px;
      border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
    }

    .sv-city-label {
      position: absolute; top: 68px; left: 16px; z-index: 9999;
      font-size: 32px; font-weight: 900; color: #ff3b30;
      background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px);
      padding: 4px 12px; border-radius: 8px; border-left: 4px solid #ff3b30;
      letter-spacing: 2px; pointer-events: none;
    }

    .sv-minimap-card {
      position: absolute; top: 68px; right: 16px; z-index: 9999;
      width: 76px; height: 124px; background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(8px); border-radius: 10px; border: 2px solid #ff3b30;
      padding: 4px; box-sizing: border-box; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }
    #svMinimapCanvas { width: 100%; height: 100%; display: block; }

    .hud-bottom {
      background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(8px);
      padding: 12px 6px; border-radius: 14px; display: flex; justify-content: space-around; text-align: center;
    }
    .hud-stat-box { flex: 1; min-width: 0; }
    .hud-stat-box .title { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 2px; }
    .hud-stat-box .num { font-size: 20px; font-weight: bold; color: #fff; white-space: nowrap; }
    .hud-stat-box .unit { font-size: 10px; color: #aaa; margin-left: 1px; }

    #recorderCanvas { display: none; }
  </style>
</head>
<body>

  <div class="panel">
    <div class="control-group">
      <label>1. 匯入活動檔案</label>
      <input type="file" id="fileInput" accept=".tcx, .fit" />
      <div id="status" style="margin-top: 6px; color: #aaa; font-size: 12px;">支援 Garmin .fit 與 .tcx 格式</div>
    </div>

    <div class="control-group checkbox-group">
      <label>2. 自訂 HUD 數據指標</label>
      <label><input type="checkbox" id="showAvgSpeed" checked> 平均時速 (Avg Speed)</label>
      <label><input type="checkbox" id="showAvgHR" checked> 平均心率 (Avg HR)</label>
      <label><input type="checkbox" id="showAscent" checked> 累積爬升 (Ascent)</label>
      <label><input type="checkbox" id="showRest" checked> 累計休息 (次數 / 時間)</label>
      <label><input type="checkbox" id="showRestMarkers" checked> 地圖顯示休息標籤 (可點擊看街景)</label>
      <label><input type="checkbox" id="showDist" checked> 累積里程與進度條</label>
      <label><input type="checkbox" id="showTime" checked> 已騎乘時間</label>
      <label><input type="checkbox" id="showMinimap" checked> 右上角全島路線縮圖</label>
    </div>

    <div class="control-group">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <label style="margin:0;">3. 軌跡進度控制</label>
        <span id="scrubberPercent" style="font-size:12px; color:#fc5200; font-weight:bold;">0%</span>
      </div>
      <input type="range" id="progressScrubber" min="0" max="1000" value="0" disabled />
    </div>

    <div class="control-group">
      <label>4. 影片長度: <span id="durationVal">15</span> 秒</label>
      <input type="range" id="durationSlider" min="5" max="60" value="15" />
    </div>

    <div class="control-group">
      <label>5. 操作控制</label>
      <button id="btnPlay" disabled>播放預覽</button>
      <button id="btnRecord" disabled style="background:#28a745;">一鍵匯出限動影片 (WebM)</button>
    </div>
  </div>

  <div id="render-container">
    <div id="map"></div>

    <div id="streetviewModal">
      <div class="sv-navbar">
        <div class="sv-title" id="svInfoTitle">休息站街景</div>
        <div class="sv-nav-btns">
          <button class="sv-nav-btn" id="btnPrevRest">◀ 上一站</button>
          <button class="sv-nav-btn" id="btnNextRest">下一站 ▶</button>
          <button class="sv-close-btn" id="closeModal">✕</button>
        </div>
      </div>
      
      <div class="sv-city-label" id="svCityLabel">台南市</div>
      
      <div class="sv-minimap-card">
        <canvas id="svMinimapCanvas" width="152" height="248"></canvas>
      </div>

      <iframe id="svFrame" src=""></iframe>
    </div>

    <div class="hud-overlay" id="hudContainer">
      <div class="hud-top-bar">
        <div class="hud-top" id="topHud">
          <div class="hud-top-line" id="distLine">
            <span class="dist" id="hudDist">0.0 km</span>
            <span class="pct" id="hudPct">/ 0.0 km (0%)</span>
          </div>
          <div class="progress-track" id="progTrack">
            <div class="progress-fill" id="progFill"></div>
          </div>
          <div class="sub">
            <span class="city" id="hudCity">台灣</span>
            <span class="time" id="hudTime">00:00:00</span>
          </div>
        </div>
        <div class="minimap-card" id="minimapCard">
          <canvas id="minimapCanvas" width="160" height="260"></canvas>
        </div>
      </div>

      <div class="hud-bottom" id="bottomHud">
        <div class="hud-stat-box" id="boxAvgSpeed">
          <div class="title">均速</div>
          <span class="num" id="valAvgSpeed">0.0</span><span class="unit">km/h</span>
        </div>
        <div class="hud-stat-box" id="boxAvgHR">
          <div class="title">平均心率</div>
          <span class="num" id="valAvgHR">--</span><span class="unit">bpm</span>
        </div>
        <div class="hud-stat-box" id="boxAscent">
          <div class="title">總爬升</div>
          <span class="num" id="valAscent">0</span><span class="unit">m</span>
        </div>
        <div class="hud-stat-box" id="boxRest">
          <div class="title">休息</div>
          <span class="num" id="valRest">0次</span><span class="unit" id="valRestTime">0分</span>
        </div>
      </div>
    </div>
  </div>

  <canvas id="recorderCanvas" width="720" height="1280"></canvas>

  <script>
    let trackPoints = [];
    let restStops = [];
    let activeRestMarkers = [];
    let currentRestIndex = -1;
    let isPlaying = false;
    let animTimer = null;
    let startTimeEpoch = 0;
    let isMapLoaded = false;
    let miniBounds = null;

    const satelliteStyle = {
      version: 8,
      sources: {
        'esri-tiles': {
          type: 'raster',
          tiles: ['https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256
        }
      },
      layers: [{
        id: 'esri-layer',
        type: 'raster',
        source: 'esri-tiles',
        minzoom: 0,
        maxzoom: 18
      }]
    };

    const map = new maplibregl.Map({
      container: 'map',
      style: satelliteStyle,
      center: [120.982024, 23.973875],
      zoom: 9.2,
      pitch: 45,
      bearing: 0,
      preserveDrawingBuffer: true
    });

    map.on('load', () => {
      isMapLoaded = true;
      map.addSource('full-route', {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
      });
      map.addLayer({
        id: 'full-route-line',
        type: 'line',
        source: 'full-route',
        paint: { 'line-color': '#000000', 'line-width': 5, 'line-opacity': 0.4 }
      });

      map.addSource('active-route', {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
      });
      map.addLayer({
        id: 'active-route-line',
        type: 'line',
        source: 'active-route',
        paint: { 'line-color': '#fc5200', 'line-width': 4 }
      });

      map.addSource('point-cursor', {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'Point', coordinates: [0, 0] } }
      });
      map.addLayer({
        id: 'point-cursor-circle',
        type: 'circle',
        source: 'point-cursor',
        paint: {
          'circle-radius': 7,
          'circle-color': '#ffffff',
          'circle-stroke-width': 3,
          'circle-stroke-color': '#fc5200'
        }
      });

      if (trackPoints.length > 0) initRoute();
    });

    const svMiniCanvas = document.getElementById('svMinimapCanvas');
    const svMiniCtx = svMiniCanvas.getContext('2d');

    function drawStreetviewMinimap(restPoint) {
      if (!miniBounds || trackPoints.length === 0) return;
      svMiniCtx.clearRect(0, 0, svMiniCanvas.width, svMiniCanvas.height);

      const pad = 10;
      const w = svMiniCanvas.width - pad * 2;
      const h = svMiniCanvas.height - pad * 2;

      const scaleX = w / miniBounds.spanX;
      const scaleY = h / miniBounds.spanY;
      const scale = Math.min(scaleX, scaleY);

      const offsetX = pad + (w - miniBounds.spanX * scale) / 2;
      const offsetY = pad + (h - miniBounds.spanY * scale) / 2;

      function toPos(p) {
        return {
          x: offsetX + (p.lon - miniBounds.minX) * scale,
          y: offsetY + (miniBounds.maxY - p.lat) * scale
        };
      }

      svMiniCtx.beginPath();
      svMiniCtx.strokeStyle = '#555';
      svMiniCtx.lineWidth = 3;
      svMiniCtx.lineCap = 'round';
      svMiniCtx.lineJoin = 'round';
      trackPoints.forEach((p, i) => {
        const pos = toPos(p);
        if (i === 0) svMiniCtx.moveTo(pos.x, pos.y);
        else svMiniCtx.lineTo(pos.x, pos.y);
      });
      svMiniCtx.stroke();

      const ptPos = toPos(restPoint);
      svMiniCtx.beginPath();
      svMiniCtx.arc(ptPos.x, ptPos.y, 6, 0, Math.PI * 2);
      svMiniCtx.fillStyle = '#ff3b30';
      svMiniCtx.fill();
      svMiniCtx.lineWidth = 2;
      svMiniCtx.strokeStyle = '#ffffff';
      svMiniCtx.stroke();
    }

    function openRestStreetView(restIdx) {
      if (restIdx < 0 || restIdx >= restStops.length) return;
      currentRestIndex = restIdx;
      const r = restStops[restIdx];
      const title = `${r.order}次 ${formatMinOnly(r.durationSec)} / ${formatClockTime(r.accumRestSec)}`;
      const cityName = estimateTaiwanCity(r.lat);

      const modal = document.getElementById('streetviewModal');
      const frame = document.getElementById('svFrame');
      
      document.getElementById('svInfoTitle').innerText = title;
      document.getElementById('svCityLabel').innerText = cityName;
      
      modal.style.display = 'block';
      frame.src = `https://maps.google.com/maps?q=&layer=c&cbll=${r.lat},${r.lon}&cbp=11,0,0,0,0&output=svembed`;
      
      setTimeout(() => {
        drawStreetviewMinimap(r);
      }, 50);
    }

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('streetviewModal').style.display = 'none';
      document.getElementById('svFrame').src = '';
    });

    document.getElementById('btnPrevRest').addEventListener('click', () => {
      if (currentRestIndex > 0) openRestStreetView(currentRestIndex - 1);
    });

    document.getElementById('btnNextRest').addEventListener('click', () => {
      if (currentRestIndex < restStops.length - 1) openRestStreetView(currentRestIndex + 1);
    });

    const scrubber = document.getElementById('progressScrubber');
    const scrubberTxt = document.getElementById('scrubberPercent');
    const miniCanvas = document.getElementById('minimapCanvas');
    const miniCtx = miniCanvas.getContext('2d');
    const progFill = document.getElementById('progFill');

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();
      document.getElementById('status').innerText = '正在解析檔案...';

      if (fileName.endsWith('.fit')) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          parseFITData(evt.target.result);
        };
        reader.readAsArrayBuffer(file);
      } else {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const res = parseTCXWithRestPoints(evt.target.result);
          applyProcessedData(res.points, res.restList);
        };
        reader.readAsText(file);
      }
    });

    function parseFITData(buffer) {
      const FitParserClass = window.FitParser ? (window.FitParser.default || window.FitParser) : null;
      if (!FitParserClass) {
        document.getElementById('status').innerText = '解析庫載入失敗，請重整頁面。';
        return;
      }

      const fitParser = new FitParserClass({
        force: true,
        speedUnit: 'km/h',
        lengthUnit: 'm',
        temperatureUnit: 'celsius',
        elapsedRecordField: true
      });

      fitParser.parse(buffer, function(error, data) {
        if (error) {
          document.getElementById('status').innerText = 'FIT 解析失敗，請確認檔案有效。';
          return;
        }
        const records = data.records || [];
        const rawPoints = [];

        records.forEach(r => {
          if (r.position_lat && r.position_long) {
            rawPoints.push({
              lat: r.position_lat,
              lon: r.position_long,
              alt: r.altitude || 0,
              hr: r.heart_rate || 0,
              time: r.timestamp ? new Date(r.timestamp).toISOString() : null,
              distMeters: r.distance || 0
            });
          }
        });

        const res = analyzePoints(rawPoints);
        applyProcessedData(res.points, res.restList);
      });
    }

    function applyProcessedData(raw, rests) {
      if (raw.length === 0) {
        document.getElementById('status').innerText = '檔案內無有效 GPS 航點。';
        return;
      }
      trackPoints = downsample(raw, 900);
      restStops = rests;
      startTimeEpoch = trackPoints[0].timestamp;

      activeRestMarkers.forEach(m => m.remove());
      activeRestMarkers = [];

      const totalRestCount = restStops.length;
      const totalRestMin = restStops.length > 0 ? Math.round(restStops[restStops.length - 1].accumRestSec / 60) : 0;
      const totalAscent = trackPoints[trackPoints.length - 1].ascent;
      document.getElementById('status').innerText = `已載入 ${trackPoints.length} 點 | 總爬升: ${totalAscent}m | 休息: ${totalRestCount} 次`;

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      trackPoints.forEach(p => {
        if (p.lon < minX) minX = p.lon;
        if (p.lon > maxX) maxX = p.lon;
        if (p.lat < minY) minY = p.lat;
        if (p.lat > maxY) maxY = p.lat;
      });

      const spanX = Math.max(maxX - minX, 0.01);
      const spanY = Math.max(maxY - minY, 0.01);
      miniBounds = { minX, maxX, minY, maxY, spanX, spanY };

      document.getElementById('btnPlay').disabled = false;
      document.getElementById('btnRecord').disabled = false;
      scrubber.disabled = false;
      scrubber.value = 0;
      scrubberTxt.innerText = "0%";
      progFill.style.width = "0%";

      if (isMapLoaded) initRoute();
    }

    function initRoute() {
      const coords = trackPoints.map(p => [p.lon, p.lat]);
      if (map.getSource('full-route')) {
        map.getSource('full-route').setData({
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: coords }
        });
      }
      updateFrame(0);
    }

    scrubber.addEventListener('input', function(e) {
      if (trackPoints.length === 0) return;
      if (isPlaying) stopAnimation();
      const val = Math.max(0, Math.min(1000, parseInt(e.target.value, 10)));
      const progress = val / 1000;
      scrubberTxt.innerText = `${Math.round(progress * 100)}%`;
      progFill.style.width = `${progress * 100}%`;
      const idx = Math.min(trackPoints.length - 1, Math.floor(progress * trackPoints.length));
      updateFrame(idx);
    });

    function downsample(arr, max) {
      if (arr.length <= max) return arr;
      const step = Math.ceil(arr.length / max);
      const res = [];
      for (let i = 0; i < arr.length; i += step) res.push(arr[i]);
      res.push(arr[arr.length - 1]);
      return res;
    }

    // 核心修復：在原始完整點位上進行真實累計爬升運算（還原 1500m+ 爬升）
    function analyzePoints(rawList) {
      const points = [];
      const restList = [];
      let totalDist = 0;
      let totalAscent = 0;
      let hrSum = 0;
      let hrCount = 0;

      let restCount = 0;
      let totalRestSec = 0;
      let currentStopSec = 0;
      let stopStartIdx = 0;
      let isResting = false;

      // 建立滑動平均平滑海拔陣列，過濾氣壓計微抖動（窗口大小 5）
      const smoothedAlt = [];
      const windowSize = 5;
      for (let i = 0; i < rawList.length; i++) {
        let sum = 0, count = 0;
        for (let w = Math.max(0, i - windowSize); w <= Math.min(rawList.length - 1, i + windowSize); w++) {
          sum += (rawList[w].alt || 0);
          count++;
        }
        smoothedAlt.push(sum / count);
      }

      for (let i = 0; i < rawList.length; i++) {
        const item = rawList[i];
        const timestamp = item.time ? new Date(item.time).getTime() : 0;
        const currentLat = item.lat;
        const currentLon = item.lon;
        const currentAlt = item.alt || 0;
        const curHR = item.hr || 0;

        let dt = 0;
        let ds = 0;

        if (points.length > 0) {
          const prev = points[points.length - 1];
          dt = Math.max(0, (timestamp - prev.timestamp) / 1000);
          
          if (item.distMeters) {
            totalDist = item.distMeters / 1000;
            ds = totalDist - prev.dist;
          } else {
            ds = getDistKm(prev.lat, prev.lon, currentLat, currentLon);
            totalDist += ds;
          }

          // 真實微爬升累積：使用平滑後的氣壓高度，只要是正上升就真實累加
          const altDiff = smoothedAlt[i] - smoothedAlt[i - 1];
          if (altDiff > 0.05) {
            totalAscent += altDiff;
          }

          const instSpeed = (dt > 0) ? (ds / dt) * 3600 : 0;
          if (instSpeed < 3) {
            currentStopSec += dt;
            if (currentStopSec >= 120 && !isResting) {
              isResting = true;
              restCount++;
              stopStartIdx = points.length;
            }
            if (isResting) {
              totalRestSec += dt;
            }
          } else {
            if (isResting) {
              restList.push({
                index: stopStartIdx,
                lat: currentLat,
                lon: currentLon,
                dist: totalDist,
                order: restCount,
                durationSec: Math.round(currentStopSec),
                accumRestSec: Math.round(totalRestSec)
              });
            }
            currentStopSec = 0;
            isResting = false;
          }
        }

        if (curHR > 0) {
          hrSum += curHR;
          hrCount++;
        }

        const totalElapsedSec = points.length > 0 ? (timestamp - points[0].timestamp) / 1000 : 0;
        const movingSec = Math.max(1, totalElapsedSec - totalRestSec);
        const avgSpeed = (totalDist / (movingSec / 3600));

        points.push({
          lat: currentLat,
          lon: currentLon,
          alt: Math.round(currentAlt),
          ascent: Math.round(totalAscent),
          hr: curHR,
          avgHR: hrCount > 0 ? Math.round(hrSum / hrCount) : 0,
          dist: totalDist,
          avgSpeed: parseFloat(avgSpeed.toFixed(1)),
          timestamp: timestamp,
          restCount: restCount,
          restSec: Math.round(totalRestSec)
        });
      }
      return { points, restList };
    }

    function parseTCXWithRestPoints(xmlStr) {
      const xml = new DOMParser().parseFromString(xmlStr, "application/xml");
      const nodes = xml.getElementsByTagName("Trackpoint");
      const raw = [];

      for (let i = 0; i < nodes.length; i++) {
        const tp = nodes[i];
        const lat = tp.getElementsByTagName("LatitudeDegrees")[0];
        const lon = tp.getElementsByTagName("LongitudeDegrees")[0];
        const alt = tp.getElementsByTagName("AltitudeMeters")[0];
        const hr = tp.getElementsByTagName("HeartRateBpm")[0];
        const time = tp.getElementsByTagName("Time")[0];
        const distNode = tp.getElementsByTagName("DistanceMeters")[0];

        if (lat && lon) {
          raw.push({
            lat: parseFloat(lat.textContent),
            lon: parseFloat(lon.textContent),
            alt: alt ? parseFloat(alt.textContent) : 0,
            hr: hr ? parseInt(hr.querySelector("Value").textContent, 10) : 0,
            time: time ? time.textContent : null,
            distMeters: distNode ? parseFloat(distNode.textContent) : 0
          });
        }
      }
      return analyzePoints(raw);
    }

    function getDistKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function estimateTaiwanCity(lat) {
      if (lat >= 25.15) return "新北 富貴角";
      if (lat >= 25.00) return "新北市";
      if (lat >= 24.85) return "桃園市";
      if (lat >= 24.68) return "新竹縣市";
      if (lat >= 24.36) return "苗栗縣";
      if (lat >= 24.12) return "台中市";
      if (lat >= 23.85) return "彰化縣";
      if (lat >= 23.55) return "雲林縣";
      if (lat >= 23.25) return "嘉義縣";
      if (lat >= 22.90) return "台南市";
      if (lat >= 22.50) return "高雄市";
      if (lat >= 22.00) return "屏東 枋山";
      return "屏東 鵝鑾鼻";
    }

    function formatDuration(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function formatClockTime(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      return `${h}:${m.toString().padStart(2, '0')}`;
    }

    function formatMinOnly(sec) {
      const m = Math.round(sec / 60);
      return `${m}分`;
    }

    function drawMinimap(idx) {
      if (!miniBounds || trackPoints.length === 0) return;
      miniCtx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);

      const pad = 10;
      const w = miniCanvas.width - pad * 2;
      const h = miniCanvas.height - pad * 2;
      
      const scaleX = w / miniBounds.spanX;
      const scaleY = h / miniBounds.spanY;
      const scale = Math.min(scaleX, scaleY);

      const offsetX = pad + (w - miniBounds.spanX * scale) / 2;
      const offsetY = pad + (h - miniBounds.spanY * scale) / 2;

      function toMiniPos(p) {
        return {
          x: offsetX + (p.lon - miniBounds.minX) * scale,
          y: offsetY + (miniBounds.maxY - p.lat) * scale
        };
      }

      miniCtx.beginPath();
      miniCtx.strokeStyle = '#444';
      miniCtx.lineWidth = 3;
      miniCtx.lineCap = 'round';
      miniCtx.lineJoin = 'round';
      trackPoints.forEach((p, i) => {
        const pos = toMiniPos(p);
        if (i === 0) miniCtx.moveTo(pos.x, pos.y);
        else miniCtx.lineTo(pos.x, pos.y);
      });
      miniCtx.stroke();

      miniCtx.beginPath();
      miniCtx.strokeStyle = '#fc5200';
      miniCtx.lineWidth = 4;
      miniCtx.lineCap = 'round';
      miniCtx.lineJoin = 'round';
      for (let i = 0; i <= idx; i++) {
        const pos = toMiniPos(trackPoints[i]);
        if (i === 0) miniCtx.moveTo(pos.x, pos.y);
        else miniCtx.lineTo(pos.x, pos.y);
      }
      miniCtx.stroke();

      const curPos = toMiniPos(trackPoints[idx]);
      miniCtx.beginPath();
      miniCtx.arc(curPos.x, curPos.y, 5, 0, Math.PI * 2);
      miniCtx.fillStyle = '#ffffff';
      miniCtx.fill();
      miniCtx.lineWidth = 2.5;
      miniCtx.strokeStyle = '#fc5200';
      miniCtx.stroke();
    }

    function updateFrame(idx) {
      if (!trackPoints.length || !isMapLoaded) return;
      const current = trackPoints[idx];

      map.jumpTo({
        center: [current.lon, current.lat],
        zoom: 9.2,
        pitch: 45,
        bearing: 0
      });

      const activeCoords = trackPoints.slice(0, idx + 1).map(p => [p.lon, p.lat]);
      if (map.getSource('active-route')) {
        map.getSource('active-route').setData({
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: activeCoords }
        });
      }
      if (map.getSource('point-cursor')) {
        map.getSource('point-cursor').setData({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [current.lon, current.lat] }
        });
      }

      const showRestMarkers = document.getElementById('showRestMarkers').checked;
      const passedRestStops = restStops.filter(r => r.dist <= current.dist);

      while (activeRestMarkers.length > passedRestStops.length) {
        const m = activeRestMarkers.pop();
        m.remove();
      }

      if (showRestMarkers) {
        for (let i = activeRestMarkers.length; i < passedRestStops.length; i++) {
          const r = passedRestStops[i];
          const el = document.createElement('div');
          el.className = 'rest-marker-container';
          el.innerHTML = `
            <div class="rest-dot"></div>
            <div class="rest-tag">${r.order}次 ${formatMinOnly(r.durationSec)} / ${formatClockTime(r.accumRestSec)}</div>
          `;
          el.addEventListener('click', (ev) => {
            ev.stopPropagation();
            openRestStreetView(i);
          });

          const marker = new maplibregl.Marker({ element: el, anchor: 'left' })
            .setLngLat([r.lon, r.lat])
            .addTo(map);

          activeRestMarkers.push(marker);
        }
      } else {
        activeRestMarkers.forEach(m => m.remove());
        activeRestMarkers = [];
      }

      const totalDist = trackPoints[trackPoints.length - 1].dist || 1;
      const pct = Math.min(100, Math.round((current.dist / totalDist) * 100));
      document.getElementById('hudDist').innerText = `${current.dist.toFixed(1)} km`;
      document.getElementById('hudPct').innerText = `/ ${totalDist.toFixed(1)} km (${pct}%)`;
      progFill.style.width = `${pct}%`;
      document.getElementById('hudCity').innerText = estimateTaiwanCity(current.lat);

      if (startTimeEpoch && current.timestamp) {
        const elapsedSec = Math.max(0, (current.timestamp - startTimeEpoch) / 1000);
        document.getElementById('hudTime').innerText = formatDuration(elapsedSec);
      }

      document.getElementById('valAvgSpeed').innerText = current.avgSpeed.toFixed(1);
      document.getElementById('valAvgHR').innerText = current.avgHR || '--';
      document.getElementById('valAscent').innerText = current.ascent;
      
      document.getElementById('valRest').innerText = `${current.restCount}次`;
      const restMin = Math.round(current.restSec / 60);
      document.getElementById('valRestTime').innerText = restMin > 60 ? `${Math.floor(restMin/60)}時${restMin%60}分` : `${restMin}分`;

      const showDist = document.getElementById('showDist').checked;
      const showTime = document.getElementById('showTime').checked;
      document.getElementById('topHud').style.display = (showDist || showTime) ? 'flex' : 'none';
      document.getElementById('distLine').style.display = showDist ? 'flex' : 'none';
      document.getElementById('progTrack').style.display = showDist ? 'block' : 'none';
      document.getElementById('hudTime').style.display = showTime ? 'inline' : 'none';
      document.getElementById('minimapCard').style.display = document.getElementById('showMinimap').checked ? 'flex' : 'none';

      document.getElementById('boxAvgSpeed').style.display = document.getElementById('showAvgSpeed').checked ? 'block' : 'none';
      document.getElementById('boxAvgHR').style.display = document.getElementById('showAvgHR').checked ? 'block' : 'none';
      document.getElementById('boxAscent').style.display = document.getElementById('showAscent').checked ? 'block' : 'none';
      document.getElementById('boxRest').style.display = document.getElementById('showRest').checked ? 'block' : 'none';

      drawMinimap(idx);
    }

    function runAnimation(onFinish) {
      if (isPlaying) stopAnimation();
      isPlaying = true;
      document.getElementById('btnPlay').innerText = '停止預覽';

      const durationSec = parseInt(document.getElementById('durationSlider').value, 10);
      const fps = 30;
      const totalFrames = durationSec * fps;
      const totalPoints = trackPoints.length;
      let frame = 0;

      animTimer = setInterval(() => {
        frame++;
        const progress = Math.min(frame / totalFrames, 1);
        const idx = Math.min(totalPoints - 1, Math.floor(progress * (totalPoints - 1)));

        scrubber.value = Math.floor(progress * 1000);
        scrubberTxt.innerText = `${Math.round(progress * 100)}%`;

        updateFrame(idx);

        if (frame >= totalFrames) {
          stopAnimation();
          if (onFinish) onFinish();
        }
      }, 1000 / fps);
    }

    function stopAnimation() {
      isPlaying = false;
      if (animTimer) clearInterval(animTimer);
      document.getElementById('btnPlay').innerText = '播放預覽';
    }

    document.getElementById('btnPlay').addEventListener('click', () => {
      if (isPlaying) stopAnimation();
      else runAnimation();
    });

    // 專屬 9:16 純淨輸出（無黑塊、純淨渲染）
    document.getElementById('btnRecord').addEventListener('click', function() {
      const btn = this;
      btn.disabled = true;
      btn.innerText = '正在合成輸出 9:16 限動...';

      const recCanvas = document.getElementById('recorderCanvas');
      const recCtx = recCanvas.getContext('2d');
      const mapCanvas = map.getCanvas();

      function composeFrame() {
        recCtx.drawImage(mapCanvas, 0, 0, recCanvas.width, recCanvas.height);

        // 繪製休息站標籤至影片
        if (document.getElementById('showRestMarkers').checked) {
          const currentProgress = parseFloat(scrubber.value) / 1000;
          const currentIdx = Math.min(trackPoints.length - 1, Math.floor(currentProgress * trackPoints.length));
          const currentDist = trackPoints[currentIdx].dist;
          const passed = restStops.filter(r => r.dist <= currentDist);

          passed.forEach(r => {
            const p = map.project([r.lon, r.lat]);
            const sx = (p.x / map.getContainer().clientWidth) * recCanvas.width;
            const sy = (p.y / map.getContainer().clientHeight) * recCanvas.height;

            recCtx.beginPath();
            recCtx.arc(sx, sy, 8, 0, Math.PI * 2);
            recCtx.fillStyle = '#00ffff';
            recCtx.fill();
            recCtx.lineWidth = 3;
            recCtx.strokeStyle = '#ffffff';
            recCtx.stroke();

            const txt = `${r.order}次 ${formatMinOnly(r.durationSec)} / ${formatClockTime(r.accumRestSec)}`;
            recCtx.font = 'bold 20px -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif';
            recCtx.textBaseline = 'middle';
            const tw = recCtx.measureText(txt).width;

            if (tw > 0) {
              recCtx.fillStyle = 'rgba(5, 17, 30, 0.88)';
              recCtx.strokeStyle = '#00ffff';
              recCtx.lineWidth = 1.5;
              recCtx.beginPath();
              recCtx.roundRect(sx + 14, sy - 18, tw + 18, 36, 6);
              recCtx.fill();
              recCtx.stroke();

              recCtx.fillStyle = '#ffffff';
              recCtx.fillText(txt, sx + 23, sy);
            }
          });
        }

        const showDist = document.getElementById('showDist').checked;
        const showTime = document.getElementById('showTime').checked;
        if (showDist || showTime) {
          recCtx.fillStyle = 'rgba(18, 18, 18, 0.88)';
          recCtx.beginPath();
          recCtx.roundRect(32, 32, 420, 120, 16);
          recCtx.fill();

          if (showDist) {
            recCtx.fillStyle = '#ffffff';
            recCtx.font = 'bold 36px sans-serif';
            recCtx.textBaseline = 'alphabetic';
            recCtx.fillText(document.getElementById('hudDist').innerText, 50, 78);

            recCtx.fillStyle = '#888888';
            recCtx.font = '22px sans-serif';
            recCtx.fillText(document.getElementById('hudPct').innerText, 220, 78);

            const curProg = parseFloat(scrubber.value) / 1000;
            recCtx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            recCtx.fillRect(50, 92, 380, 6);
            recCtx.fillStyle = '#fc5200';
            recCtx.fillRect(50, 92, 380 * curProg, 6);
          }

          recCtx.fillStyle = '#fc5200';
          recCtx.font = 'bold 20px sans-serif';
          recCtx.fillText(document.getElementById('hudCity').innerText, 50, 132);

          if (showTime) {
            recCtx.fillStyle = '#aaaaaa';
            recCtx.font = '18px sans-serif';
            recCtx.fillText(document.getElementById('hudTime').innerText, 220, 132);
          }
        }

        if (document.getElementById('showMinimap').checked) {
          recCtx.fillStyle = 'rgba(18, 18, 18, 0.88)';
          recCtx.beginPath();
          recCtx.roundRect(recCanvas.width - 180, 32, 148, 250, 14);
          recCtx.fill();
          recCtx.drawImage(miniCanvas, recCanvas.width - 180, 32, 148, 250);
        }

        const activeBoxes = [];
        if (document.getElementById('showAvgSpeed').checked) activeBoxes.push({ label: '均速', val: document.getElementById('valAvgSpeed').innerText, unit: 'km/h' });
        if (document.getElementById('showAvgHR').checked) activeBoxes.push({ label: '平均心率', val: document.getElementById('valAvgHR').innerText, unit: 'bpm' });
        if (document.getElementById('showAscent').checked) activeBoxes.push({ label: '總爬升', val: document.getElementById('valAscent').innerText, unit: 'm' });
        if (document.getElementById('showRest').checked) activeBoxes.push({ label: '休息', val: document.getElementById('valRest').innerText, unit: document.getElementById('valRestTime').innerText });

        if (activeBoxes.length > 0) {
          const bY = recCanvas.height - 180;
          const bW = (recCanvas.width - 64) / activeBoxes.length;

          recCtx.fillStyle = 'rgba(18, 18, 18, 0.9)';
          recCtx.beginPath();
          recCtx.roundRect(32, bY, recCanvas.width - 64, 110, 18);
          recCtx.fill();

          activeBoxes.forEach((item, i) => {
            const ix = 48 + (i * bW);
            recCtx.fillStyle = '#888888';
            recCtx.font = 'bold 16px sans-serif';
            recCtx.fillText(item.label, ix, bY + 36);

            recCtx.fillStyle = '#ffffff';
            recCtx.font = 'bold 28px sans-serif';
            recCtx.fillText(item.val, ix, bY + 80);

            recCtx.fillStyle = '#aaaaaa';
            recCtx.font = '14px sans-serif';
            recCtx.fillText(item.unit, ix + (item.val.length * 18) + 4, bY + 80);
          });
        }
      }

      const stream = recCanvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      const chunks = [];

      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ride_story_${Date.now()}.webm`;
        a.click();
        btn.disabled = false;
        btn.innerText = '一鍵匯出限動影片 (WebM)';
      };

      recorder.start();
      const syncInterval = setInterval(composeFrame, 1000 / 30);

      scrubber.value = 0;
      runAnimation(() => {
        clearInterval(syncInterval);
        recorder.stop();
      });
    });

    document.querySelectorAll('.checkbox-group input').forEach(box => {
      box.addEventListener('change', () => {
        if (trackPoints.length) {
          const val = Math.max(0, Math.min(1000, parseInt(scrubber.value, 10)));
          updateFrame(Math.floor((val / 1000) * (trackPoints.length - 1)));
        }
      });
    });

    document.getElementById('durationSlider').addEventListener('input', e => {
      document.getElementById('durationVal').innerText = e.target.value;
    });
  </script>
</body>
