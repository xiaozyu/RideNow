<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>RideNow - 單車動態視覺化</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <style>
    body {
      margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #121212; color: #fff; display: flex; gap: 24px;
    }
    .panel { width: 340px; display: flex; flex-direction: column; gap: 14px; }
    .control-group { background: #1e1e1e; padding: 14px; border-radius: 8px; font-size: 14px; }
    .control-group label { display: block; margin-bottom: 6px; font-weight: bold; }
    .checkbox-group label { display: flex; align-items: center; gap: 8px; font-weight: normal; margin-bottom: 6px; cursor: pointer; }
    input[type="range"] { width: 100%; accent-color: #fc5200; }
    button {
      background: #fc5200; color: #fff; border: none; padding: 10px 14px;
      border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 6px;
    }
    button:disabled { background: #555; cursor: not-allowed; }

    /* 9:16 直式容器 */
    #render-container {
      position: relative; width: 360px; height: 640px;
      border-radius: 16px; overflow: hidden; background: #000; border: 2px solid #333;
    }
    #map { width: 100%; height: 100%; }

    .hud-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
      padding: 16px; box-sizing: border-box; z-index: 10;
    }
    
    .hud-top-bar {
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .hud-top {
      background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(8px);
      padding: 10px 14px; border-radius: 12px; display: flex; flex-direction: column; gap: 4px;
    }
    .hud-top-line { display: flex; align-items: baseline; gap: 8px; }
    .hud-top .dist { font-size: 22px; font-weight: bold; color: #fff; }
    .hud-top .pct { font-size: 13px; color: #888; }
    .hud-top .sub { display: flex; gap: 8px; font-size: 12px; }
    .hud-top .city { color: #fc5200; font-weight: bold; }
    .hud-top .time { color: #aaa; }
    
    /* 右上角迷你雷達全圖 */
    .minimap-card {
      width: 76px; height: 128px; background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(8px); border-radius: 10px; border: 1px solid #333;
      position: relative; padding: 4px; box-sizing: border-box;
    }
    #minimapCanvas { width: 100%; height: 100%; }

    .hud-bottom {
      background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(8px);
      padding: 12px 6px; border-radius: 14px; display: flex; justify-content: space-around; text-align: center;
    }
    .hud-stat-box { flex: 1; }
    .hud-stat-box .title { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 2px; }
    .hud-stat-box .num { font-size: 20px; font-weight: bold; color: #fff; }
    .hud-stat-box .unit { font-size: 10px; color: #aaa; margin-left: 1px; }

    /* 後台 9:16 純淨錄影畫布 */
    #recorderCanvas { display: none; }
  </style>
</head>
<body>

  <div class="panel">
    <div class="control-group">
      <label>1. 匯入活動檔案</label>
      <input type="file" id="tcxInput" accept=".tcx" />
      <div id="status" style="margin-top: 6px; color: #aaa; font-size: 12px;">支援 Garmin .tcx 檔案</div>
    </div>

    <div class="control-group checkbox-group">
      <label>2. 自訂 HUD 儀表顯示</label>
      <label><input type="checkbox" id="showSpeed" checked> 即時時速 (km/h)</label>
      <label><input type="checkbox" id="showHR" checked> 即時心率 (bpm)</label>
      <label><input type="checkbox" id="showElev" checked> 海拔高度 (m)</label>
      <label><input type="checkbox" id="showCad" checked> 踩踏踏頻 (rpm)</label>
      <label><input type="checkbox" id="showDist" checked> 累積里程與進度</label>
      <label><input type="checkbox" id="showTime" checked> 已騎乘時間</label>
      <label><input type="checkbox" id="showMinimap" checked> 右上角全島雷達圖</label>
    </div>

    <div class="control-group">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <label style="margin:0;">3. 軌跡進度控制</label>
        <span id="scrubberPercent" style="font-size:12px; color:#fc5200; font-weight:bold;">0%</span>
      </div>
      <input type="range" id="progressScrubber" min="0" max="1000" value="0" disabled />
    </div>

    <div class="control-group">
      <label>4. 影片長度: <span id="durationVal">15</span> 秒</label>
      <input type="range" id="durationSlider" min="5" max="60" value="15" />
    </div>

    <div class="control-group">
      <label>5. 操作控制</label>
      <button id="btnPlay" disabled>播放預覽</button>
      <button id="btnRecord" disabled style="background:#28a745;">一鍵匯出限動影片 (WebM)</button>
    </div>
  </div>

  <div id="render-container">
    <div id="map"></div>
    <div class="hud-overlay" id="hudContainer">
      <div class="hud-top-bar">
        <div class="hud-top" id="topHud">
          <div class="hud-top-line" id="distLine">
            <span class="dist" id="hudDist">0.0 km</span>
            <span class="pct" id="hudPct">/ 0.0 km (0%)</span>
          </div>
          <div class="sub">
            <span class="city" id="hudCity">台灣</span>
            <span class="time" id="hudTime">00:00:00</span>
          </div>
        </div>
        <div class="minimap-card" id="minimapCard">
          <canvas id="minimapCanvas" width="152" height="256"></canvas>
        </div>
      </div>

      <div class="hud-bottom" id="bottomHud">
        <div class="hud-stat-box" id="boxSpeed">
          <div class="title">時速</div>
          <span class="num" id="valSpeed">0</span><span class="unit">km/h</span>
        </div>
        <div class="hud-stat-box" id="boxHR">
          <div class="title">心率</div>
          <span class="num" id="valHR">--</span><span class="unit">bpm</span>
        </div>
        <div class="hud-stat-box" id="boxElev">
          <div class="title">海拔</div>
          <span class="num" id="valElev">0</span><span class="unit">m</span>
        </div>
        <div class="hud-stat-box" id="boxCad">
          <div class="title">踏頻</div>
          <span class="num" id="valCad">--</span><span class="unit">rpm</span>
        </div>
      </div>
    </div>
  </div>

  <canvas id="recorderCanvas" width="720" height="1280"></canvas>

  <script>
    let trackPoints = [];
    let isPlaying = false;
    let animTimer = null;
    let startTimeEpoch = 0;
    let isMapLoaded = false;
    let miniBounds = null;

    const satelliteStyle = {
      version: 8,
      sources: {
        'esri-tiles': {
          type: 'raster',
          tiles: ['https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256
        }
      },
      layers: [{
        id: 'esri-layer',
        type: 'raster',
        source: 'esri-tiles',
        minzoom: 0,
        maxzoom: 18
      }]
    };

    const map = new maplibregl.Map({
      container: 'map',
      style: satelliteStyle,
      center: [120.982024, 23.973875],
      zoom: 9.2,
      pitch: 45,
      bearing: 0,
      preserveDrawingBuffer: true
    });

    map.on('load', () => {
      isMapLoaded = true;
      map.addSource('full-route', {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
      });
      map.addLayer({
        id: 'full-route-line',
        type: 'line',
        source: 'full-route',
        paint: { 'line-color': '#000000', 'line-width': 5, 'line-opacity': 0.4 }
      });

      map.addSource('active-route', {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
      });
      map.addLayer({
        id: 'active-route-line',
        type: 'line',
        source: 'active-route',
        paint: { 'line-color': '#fc5200', 'line-width': 4 }
      });

      map.addSource('point-cursor', {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'Point', coordinates: [0, 0] } }
      });
      map.addLayer({
        id: 'point-cursor-circle',
        type: 'circle',
        source: 'point-cursor',
        paint: {
          'circle-radius': 7,
          'circle-color': '#ffffff',
          'circle-stroke-width': 3,
          'circle-stroke-color': '#fc5200'
        }
      });

      if (trackPoints.length > 0) initRoute();
    });

    const scrubber = document.getElementById('progressScrubber');
    const scrubberTxt = document.getElementById('scrubberPercent');
    const miniCanvas = document.getElementById('minimapCanvas');
    const miniCtx = miniCanvas.getContext('2d');

    document.getElementById('tcxInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const raw = parseTCX(evt.target.result);
        if (raw.length > 0) {
          trackPoints = downsample(raw, 900);
          startTimeEpoch = trackPoints[0].timestamp;
          document.getElementById('status').innerText = `已載入 ${trackPoints.length} 個點位`;

          // 計算全島雷達圖邊界
          let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
          trackPoints.forEach(p => {
            if (p.lon < minX) minX = p.lon;
            if (p.lon > maxX) maxX = p.lon;
            if (p.lat < minY) minY = p.lat;
            if (p.lat > maxY) maxY = p.lat;
          });
          miniBounds = { minX, maxX, minY, maxY };

          document.getElementById('btnPlay').disabled = false;
          document.getElementById('btnRecord').disabled = false;
          scrubber.disabled = false;
          scrubber.value = 0;
          scrubberTxt.innerText = "0%";

          if (isMapLoaded) initRoute();
        }
      };
      reader.readAsText(file);
    });

    function initRoute() {
      const coords = trackPoints.map(p => [p.lon, p.lat]);
      if (map.getSource('full-route')) {
        map.getSource('full-route').setData({
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: coords }
        });
      }
      updateFrame(0);
    }

    scrubber.addEventListener('input', function(e) {
      if (trackPoints.length === 0) return;
      if (isPlaying) stopAnimation();
      const val = Math.max(0, Math.min(1000, parseInt(e.target.value, 10)));
      const progress = val / 1000;
      scrubberTxt.innerText = `${Math.round(progress * 100)}%`;
      const idx = Math.min(trackPoints.length - 1, Math.floor(progress * trackPoints.length));
      updateFrame(idx);
    });

    function downsample(arr, max) {
      if (arr.length <= max) return arr;
      const step = Math.ceil(arr.length / max);
      const res = [];
      for (let i = 0; i < arr.length; i += step) res.push(arr[i]);
      res.push(arr[arr.length - 1]);
      return res;
    }

    function parseTCX(xmlStr) {
      const xml = new DOMParser().parseFromString(xmlStr, "application/xml");
      const nodes = xml.getElementsByTagName("Trackpoint");
      const list = [];
      let totalDist = 0;

      for (let i = 0; i < nodes.length; i++) {
        const tp = nodes[i];
        const lat = tp.getElementsByTagName("LatitudeDegrees")[0];
        const lon = tp.getElementsByTagName("LongitudeDegrees")[0];
        const alt = tp.getElementsByTagName("AltitudeMeters")[0];
        const hr = tp.getElementsByTagName("HeartRateBpm")[0];
        const cad = tp.getElementsByTagName("Cadence")[0];
        const time = tp.getElementsByTagName("Time")[0];
        const distNode = tp.getElementsByTagName("DistanceMeters")[0];

        let speedVal = 0;
        const speedNode = tp.getElementsByTagName("Speed")[0] || tp.getElementsByTagName("ns3:Speed")[0];
        if (speedNode) speedVal = parseFloat(speedNode.textContent) * 3.6;

        if (lat && lon) {
          const timestamp = time ? new Date(time.textContent).getTime() : 0;
          const currentLat = parseFloat(lat.textContent);
          const currentLon = parseFloat(lon.textContent);
          
          if (distNode) {
            totalDist = parseFloat(distNode.textContent) / 1000;
          } else if (list.length > 0) {
            const prev = list[list.length - 1];
            totalDist += getDistKm(prev.lat, prev.lon, currentLat, currentLon);
          }

          if (!speedNode && list.length > 0) {
            const prev = list[list.length - 1];
            const dt = (timestamp - prev.timestamp) / 1000;
            const ds = getDistKm(prev.lat, prev.lon, currentLat, currentLon);
            speedVal = (dt > 0) ? (ds / dt) * 3600 : 0;
          }

          list.push({
            lat: currentLat,
            lon: currentLon,
            alt: alt ? Math.round(parseFloat(alt.textContent)) : 0,
            hr: hr ? parseInt(hr.querySelector("Value").textContent, 10) : 0,
            cad: cad ? parseInt(cad.textContent, 10) : 0,
            dist: totalDist,
            speed: Math.min(85, Math.max(0, Math.round(speedVal))),
            timestamp: timestamp
          });
        }
      }
      return list;
    }

    function getDistKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 粗估西海岸騎乘經過之縣市
    function estimateTaiwanCity(lat) {
      if (lat >= 25.15) return "新北 富貴角";
      if (lat >= 25.00) return "新北市";
      if (lat >= 24.85) return "桃園市";
      if (lat >= 24.68) return "新竹縣市";
      if (lat >= 24.36) return "苗栗縣";
      if (lat >= 24.12) return "台中市";
      if (lat >= 23.85) return "彰化縣";
      if (lat >= 23.55) return "雲林縣";
      if (lat >= 23.25) return "嘉義縣";
      if (lat >= 22.90) return "台南市";
      if (lat >= 22.50) return "高雄市";
      if (lat >= 22.00) return "屏東 枋山";
      return "屏東 鵝鑾鼻";
    }

    function formatDuration(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // 繪製右上角迷你雷達全圖
    function drawMinimap(idx) {
      if (!miniBounds) return;
      miniCtx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);

      const pad = 12;
      const w = miniCanvas.width - pad * 2;
      const h = miniCanvas.height - pad * 2;
      const scaleX = w / (miniBounds.maxX - miniBounds.minX || 1);
      const scaleY = h / (miniBounds.maxY - miniBounds.minY || 1);
      const scale = Math.min(scaleX, scaleY);

      function toMiniPos(p) {
        const x = pad + (p.lon - miniBounds.minX) * scale + (w - (miniBounds.maxX - miniBounds.minX) * scale) / 2;
        const y = pad + (miniBounds.maxY - p.lat) * scale;
        return { x, y };
      }

      // 底線
      miniCtx.beginPath();
      miniCtx.strokeStyle = '#444';
      miniCtx.lineWidth = 3;
      trackPoints.forEach((p, i) => {
        const pos = toMiniPos(p);
        if (i === 0) miniCtx.moveTo(pos.x, pos.y);
        else miniCtx.lineTo(pos.x, pos.y);
      });
      miniCtx.stroke();

      // 橘色動態線
      miniCtx.beginPath();
      miniCtx.strokeStyle = '#fc5200';
      miniCtx.lineWidth = 4;
      for (let i = 0; i <= idx; i++) {
        const pos = toMiniPos(trackPoints[i]);
        if (i === 0) miniCtx.moveTo(pos.x, pos.y);
        else miniCtx.lineTo(pos.x, pos.y);
      }
      miniCtx.stroke();

      // 當前位置小紅點
      const curPos = toMiniPos(trackPoints[idx]);
      miniCtx.beginPath();
      miniCtx.arc(curPos.x, curPos.y, 5, 0, Math.PI * 2);
      miniCtx.fillStyle = '#ffffff';
      miniCtx.fill();
      miniCtx.lineWidth = 2;
      miniCtx.strokeStyle = '#fc5200';
      miniCtx.stroke();
    }

    function updateFrame(idx) {
      if (!trackPoints.length || !isMapLoaded) return;
      const current = trackPoints[idx];

      // 高空鳥瞰俯瞰前進（平滑跟隨、固定方向正北）
      map.jumpTo({
        center: [current.lon, current.lat],
        zoom: 9.2,
        pitch: 45,
        bearing: 0
      });

      const activeCoords = trackPoints.slice(0, idx + 1).map(p => [p.lon, p.lat]);
      if (map.getSource('active-route')) {
        map.getSource('active-route').setData({
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: activeCoords }
        });
      }
      if (map.getSource('point-cursor')) {
        map.getSource('point-cursor').setData({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [current.lon, current.lat] }
        });
      }

      // 更新 HUD
      const totalDist = trackPoints[trackPoints.length - 1].dist || 1;
      const pct = Math.min(100, Math.round((current.dist / totalDist) * 100));
      document.getElementById('hudDist').innerText = `${current.dist.toFixed(1)} km`;
      document.getElementById('hudPct').innerText = `/ ${totalDist.toFixed(1)} km (${pct}%)`;

      document.getElementById('hudCity').innerText = estimateTaiwanCity(current.lat);

      if (startTimeEpoch && current.timestamp) {
        const elapsedSec = Math.max(0, (current.timestamp - startTimeEpoch) / 1000);
        document.getElementById('hudTime').innerText = formatDuration(elapsedSec);
      }

      document.getElementById('valSpeed').innerText = current.speed;
      document.getElementById('valHR').innerText = current.hr || '--';
      document.getElementById('valHR').style.color = (current.hr > 165) ? '#ff4d4f' : '#fff';
      document.getElementById('valElev').innerText = current.alt;
      document.getElementById('valCad').innerText = current.cad || '--';

      // 顯隱邏輯
      const showDist = document.getElementById('showDist').checked;
      const showTime = document.getElementById('showTime').checked;
      document.getElementById('topHud').style.display = (showDist || showTime) ? 'flex' : 'none';
      document.getElementById('distLine').style.display = showDist ? 'flex' : 'none';
      document.getElementById('hudTime').style.display = showTime ? 'inline' : 'none';
      document.getElementById('minimapCard').style.display = document.getElementById('showMinimap').checked ? 'block' : 'none';

      document.getElementById('boxSpeed').style.display = document.getElementById('showSpeed').checked ? 'block' : 'none';
      document.getElementById('boxHR').style.display = document.getElementById('showHR').checked ? 'block' : 'none';
      document.getElementById('boxElev').style.display = document.getElementById('showElev').checked ? 'block' : 'none';
      document.getElementById('boxCad').style.display = document.getElementById('showCad').checked ? 'block' : 'none';

      drawMinimap(idx);
    }

    function runAnimation(onFinish) {
      if (isPlaying) stopAnimation();
      isPlaying = true;
      document.getElementById('btnPlay').innerText = '停止預覽';

      const durationSec = parseInt(document.getElementById('durationSlider').value, 10);
      const fps = 30;
      const totalFrames = durationSec * fps;
      const totalPoints = trackPoints.length;
      let frame = 0;

      animTimer = setInterval(() => {
        frame++;
        const progress = Math.min(frame / totalFrames, 1);
        const idx = Math.min(totalPoints - 1, Math.floor(progress * (totalPoints - 1)));

        scrubber.value = Math.floor(progress * 1000);
        scrubberTxt.innerText = `${Math.round(progress * 100)}%`;

        updateFrame(idx);

        if (frame >= totalFrames) {
          stopAnimation();
          if (onFinish) onFinish();
        }
      }, 1000 / fps);
    }

    function stopAnimation() {
      isPlaying = false;
      if (animTimer) clearInterval(animTimer);
      document.getElementById('btnPlay').innerText = '播放預覽';
    }

    document.getElementById('btnPlay').addEventListener('click', () => {
      if (isPlaying) stopAnimation();
      else runAnimation();
    });

    // 純淨 9:16 後台畫布錄影合成引擎（100% 只錄右側直式視窗）
    document.getElementById('btnRecord').addEventListener('click', function() {
      const btn = this;
      btn.disabled = true;
      btn.innerText = '正在合成輸出 9:16 限動...';

      const recCanvas = document.getElementById('recorderCanvas');
      const recCtx = recCanvas.getContext('2d');
      const mapCanvas = map.getCanvas();

      function composeFrame() {
        // 1. 抓取地圖畫面
        recCtx.drawImage(mapCanvas, 0, 0, recCanvas.width, recCanvas.height);

        // 2. 疊加頂部 HUD
        const showDist = document.getElementById('showDist').checked;
        const showTime = document.getElementById('showTime').checked;
        if (showDist || showTime) {
          recCtx.fillStyle = 'rgba(18, 18, 18, 0.85)';
          recCtx.roundRect(32, 32, 420, 110, 16);
          recCtx.fill();

          if (showDist) {
            recCtx.fillStyle = '#ffffff';
            recCtx.font = 'bold 36px sans-serif';
            recCtx.fillText(document.getElementById('hudDist').innerText, 50, 82);

            recCtx.fillStyle = '#888888';
            recCtx.font = '22px sans-serif';
            recCtx.fillText(document.getElementById('hudPct').innerText, 220, 82);
          }

          recCtx.fillStyle = '#fc5200';
          recCtx.font = 'bold 22px sans-serif';
          recCtx.fillText(document.getElementById('hudCity').innerText, 50, 122);

          if (showTime) {
            recCtx.fillStyle = '#aaaaaa';
            recCtx.font = '20px sans-serif';
            recCtx.fillText(document.getElementById('hudTime').innerText, 220, 122);
          }
        }

        // 3. 疊加右上角雷達圖
        if (document.getElementById('showMinimap').checked) {
          recCtx.fillStyle = 'rgba(18, 18, 18, 0.85)';
          recCtx.roundRect(recCanvas.width - 180, 32, 148, 250, 14);
          recCtx.fill();
          recCtx.drawImage(miniCanvas, recCanvas.width - 180, 32, 148, 250);
        }

        // 4. 疊加底部 HUD
        const activeBoxes = [];
        if (document.getElementById('showSpeed').checked) activeBoxes.push({ label: '時速', val: document.getElementById('valSpeed').innerText, unit: 'km/h' });
        if (document.getElementById('showHR').checked) activeBoxes.push({ label: '心率', val: document.getElementById('valHR').innerText, unit: 'bpm' });
        if (document.getElementById('showElev').checked) activeBoxes.push({ label: '海拔', val: document.getElementById('valElev').innerText, unit: 'm' });
        if (document.getElementById('showCad').checked) activeBoxes.push({ label: '踏頻', val: document.getElementById('valCad').innerText, unit: 'rpm' });

        if (activeBoxes.length > 0) {
          const bY = recCanvas.height - 180;
          const bW = (recCanvas.width - 64) / activeBoxes.length;

          recCtx.fillStyle = 'rgba(18, 18, 18, 0.9)';
          recCtx.roundRect(32, bY, recCanvas.width - 64, 110, 18);
          recCtx.fill();

          activeBoxes.forEach((item, i) => {
            const ix = 52 + (i * bW);
            recCtx.fillStyle = '#888888';
            recCtx.font = 'bold 18px sans-serif';
            recCtx.fillText(item.label, ix, bY + 36);

            recCtx.fillStyle = '#ffffff';
            recCtx.font = 'bold 36px sans-serif';
            recCtx.fillText(item.val, ix, bY + 82);

            recCtx.fillStyle = '#aaaaaa';
            recCtx.font = '16px sans-serif';
            recCtx.fillText(item.unit, ix + (item.val.length * 20) + 4, bY + 82);
          });
        }
      }

      const stream = recCanvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      const chunks = [];

      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ride_story_${Date.now()}.webm`;
        a.click();
        btn.disabled = false;
        btn.innerText = '一鍵匯出限動影片 (WebM)';
      };

      recorder.start();
      const syncInterval = setInterval(composeFrame, 1000 / 30);

      scrubber.value = 0;
      runAnimation(() => {
        clearInterval(syncInterval);
        recorder.stop();
      });
    });

    document.querySelectorAll('.checkbox-group input').forEach(box => {
      box.addEventListener('change', () => {
        if (trackPoints.length) {
          const val = Math.max(0, Math.min(1000, parseInt(scrubber.value, 10)));
          updateFrame(Math.floor((val / 1000) * (trackPoints.length - 1)));
        }
      });
    });

    document.getElementById('durationSlider').addEventListener('input', e => {
      document.getElementById('durationVal').innerText = e.target.value;
    });
  </script>
</body>
</html>
