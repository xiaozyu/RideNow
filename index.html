<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>RideNow - 單車動態視覺化</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <style>
    body {
      margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #121212; color: #fff; display: flex; gap: 24px;
    }
    .panel { width: 340px; display: flex; flex-direction: column; gap: 14px; }
    .control-group { background: #1e1e1e; padding: 14px; border-radius: 8px; font-size: 14px; }
    .control-group label { display: block; margin-bottom: 6px; font-weight: bold; }
    .checkbox-group label { display: flex; align-items: center; gap: 8px; font-weight: normal; margin-bottom: 6px; cursor: pointer; }
    input[type="range"] { width: 100%; accent-color: #fc5200; }
    button {
      background: #fc5200; color: #fff; border: none; padding: 10px 14px;
      border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 6px;
    }
    button:disabled { background: #555; cursor: not-allowed; }

    #render-container {
      position: relative; width: 360px; height: 640px;
      border-radius: 16px; overflow: hidden; background: #000; border: 2px solid #333;
    }
    #map { width: 100%; height: 100%; }

    .hud-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
      padding: 16px; box-sizing: border-box; z-index: 10;
    }
    .hud-top {
      background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(8px);
      padding: 12px 16px; border-radius: 12px; display: flex; flex-direction: column; gap: 4px;
    }
    .hud-top-line { display: flex; align-items: baseline; gap: 8px; }
    .hud-top .dist { font-size: 24px; font-weight: bold; color: #fff; }
    .hud-top .pct { font-size: 14px; color: #888; }
    .hud-top .time { font-size: 13px; color: #fc5200; font-weight: bold; }
    
    .hud-bottom {
      background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(8px);
      padding: 12px 6px; border-radius: 14px; display: flex; justify-content: space-around; text-align: center;
    }
    .hud-stat-box { flex: 1; }
    .hud-stat-box .title { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 2px; }
    .hud-stat-box .num { font-size: 20px; font-weight: bold; color: #fff; }
    .hud-stat-box .unit { font-size: 10px; color: #aaa; margin-left: 1px; }
  </style>
</head>
<body>

  <div class="panel">
    <div class="control-group">
      <label>1. 匯入活動檔案</label>
      <input type="file" id="tcxInput" accept=".tcx" />
      <div id="status" style="margin-top: 6px; color: #aaa; font-size: 12px;">支援 Garmin .tcx 檔案</div>
    </div>

    <div class="control-group checkbox-group">
      <label>2. 自訂 HUD 儀表顯示</label>
      <label><input type="checkbox" id="showSpeed" checked> 即時時速 (km/h)</label>
      <label><input type="checkbox" id="showHR" checked> 即時心率 (bpm)</label>
      <label><input type="checkbox" id="showElev" checked> 海拔高度 (m)</label>
      <label><input type="checkbox" id="showCad" checked> 踩踏踏頻 (rpm)</label>
      <label><input type="checkbox" id="showDist" checked> 累積里程與完成度</label>
      <label><input type="checkbox" id="showTime" checked> 已騎乘時間</label>
    </div>

    <div class="control-group">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <label style="margin:0;">3. 軌跡進度控制</label>
        <span id="scrubberPercent" style="font-size:12px; color:#fc5200; font-weight:bold;">0%</span>
      </div>
      <input type="range" id="progressScrubber" min="0" max="1000" value="0" disabled />
    </div>

    <div class="control-group">
      <label>4. 影片長度: <span id="durationVal">15</span> 秒</label>
      <input type="range" id="durationSlider" min="5" max="60" value="15" />
    </div>

    <div class="control-group">
      <label>5. 操作控制</label>
      <button id="btnPlay" disabled>播放預覽</button>
      <button id="btnRecord" disabled style="background:#28a745;">錄製並下載 IG 限動 (WebM)</button>
    </div>
  </div>

  <div id="render-container">
    <div id="map"></div>
    <div class="hud-overlay" id="hudContainer">
      <div class="hud-top" id="topHud">
        <div class="hud-top-line" id="distLine">
          <span class="dist" id="hudDist">0.0 km</span>
          <span class="pct" id="hudPct">/ 0.0 km (0%)</span>
        </div>
        <div class="time" id="hudTime" style="display:none;">時間: 00:00:00</div>
      </div>
      <div class="hud-bottom" id="bottomHud">
        <div class="hud-stat-box" id="boxSpeed">
          <div class="title">時速</div>
          <span class="num" id="valSpeed">0</span><span class="unit">km/h</span>
        </div>
        <div class="hud-stat-box" id="boxHR">
          <div class="title">心率</div>
          <span class="num" id="valHR">--</span><span class="unit">bpm</span>
        </div>
        <div class="hud-stat-box" id="boxElev">
          <div class="title">海拔</div>
          <span class="num" id="valElev">0</span><span class="unit">m</span>
        </div>
        <div class="hud-stat-box" id="boxCad">
          <div class="title">踏頻</div>
          <span class="num" id="valCad">--</span><span class="unit">rpm</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let trackPoints = [];
    let isPlaying = false;
    let animFrame = null;
    let startTimeEpoch = 0;

    const satelliteStyle = {
      version: 8,
      sources: {
        'esri-tiles': {
          type: 'raster',
          tiles: ['https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256
        }
      },
      layers: [{
        id: 'esri-layer',
        type: 'raster',
        source: 'esri-tiles',
        minzoom: 0,
        maxzoom: 18
      }]
    };

    const map = new maplibregl.Map({
      container: 'map',
      style: satelliteStyle,
      center: [120.982024, 23.973875],
      zoom: 7,
      preserveDrawingBuffer: true
    });

    map.on('load', () => {
      map.addSource('full-route', {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
      });
      map.addLayer({
        id: 'full-route-line',
        type: 'line',
        source: 'full-route',
        paint: { 'line-color': '#000000', 'line-width': 5, 'line-opacity': 0.5 }
      });

      map.addSource('active-route', {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
      });
      map.addLayer({
        id: 'active-route-line',
        type: 'line',
        source: 'active-route',
        paint: { 'line-color': '#fc5200', 'line-width': 4 }
      });

      map.addSource('point-cursor', {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'Point', coordinates: [0, 0] } }
      });
      map.addLayer({
        id: 'point-cursor-circle',
        type: 'circle',
        source: 'point-cursor',
        paint: {
          'circle-radius': 7,
          'circle-color': '#ffffff',
          'circle-stroke-width': 3,
          'circle-stroke-color': '#fc5200'
        }
      });
    });

    const scrubber = document.getElementById('progressScrubber');
    const scrubberTxt = document.getElementById('scrubberPercent');

    document.getElementById('tcxInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const raw = parseTCX(evt.target.result);
        if (raw.length > 0) {
          trackPoints = downsample(raw, 1200);
          startTimeEpoch = trackPoints[0].timestamp;
          document.getElementById('status').innerText = `已成功載入 ${trackPoints.length} 個點位`;
          
          document.getElementById('btnPlay').disabled = false;
          document.getElementById('btnRecord').disabled = false;
          scrubber.disabled = false;
          scrubber.value = 0;
          scrubberTxt.innerText = "0%";

          const coords = trackPoints.map(p => [p.lon, p.lat]);
          if (map.getSource('full-route')) {
            map.getSource('full-route').setData({
              type: 'Feature',
              geometry: { type: 'LineString', coordinates: coords }
            });
          }

          const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
          map.fitBounds(bounds, { padding: 40, duration: 0 });

          updateFrame(0);
        }
      };
      reader.readAsText(file);
    });

    scrubber.addEventListener('input', function(e) {
      if (trackPoints.length === 0) return;
      if (isPlaying) {
        isPlaying = false;
        cancelAnimationFrame(animFrame);
      }
      const progress = parseFloat(e.target.value) / 1000;
      scrubberTxt.innerText = `${(progress * 100).toFixed(0)}%`;
      const idx = Math.min(trackPoints.length - 1, Math.floor(progress * trackPoints.length));
      updateFrame(idx);
    });

    function downsample(arr, max) {
      if (arr.length <= max) return arr;
      const step = Math.ceil(arr.length / max);
      const res = [];
      for (let i = 0; i < arr.length; i += step) res.push(arr[i]);
      res.push(arr[arr.length - 1]);
      return res;
    }

    // 精確解析 TCX 原生 Garmin 速度、踏頻與時間
    function parseTCX(xmlStr) {
      const xml = new DOMParser().parseFromString(xmlStr, "application/xml");
      const nodes = xml.getElementsByTagName("Trackpoint");
      const list = [];
      let totalDist = 0;

      for (let i = 0; i < nodes.length; i++) {
        const tp = nodes[i];
        const lat = tp.getElementsByTagName("LatitudeDegrees")[0];
        const lon = tp.getElementsByTagName("LongitudeDegrees")[0];
        const alt = tp.getElementsByTagName("AltitudeMeters")[0];
        const hr = tp.getElementsByTagName("HeartRateBpm")[0];
        const cad = tp.getElementsByTagName("Cadence")[0];
        const time = tp.getElementsByTagName("Time")[0];
        const distNode = tp.getElementsByTagName("DistanceMeters")[0];

        // 讀取 Garmin 專屬速度延伸標籤 (ns3:Speed, 單位為 m/s)
        let speedVal = 0;
        const speedNode = tp.getElementsByTagName("Speed")[0] || tp.getElementsByTagName("ns3:Speed")[0];
        if (speedNode) {
          speedVal = parseFloat(speedNode.textContent) * 3.6; // 換算成 km/h
        }

        if (lat && lon) {
          const timestamp = time ? new Date(time.textContent).getTime() : 0;
          const currentLat = parseFloat(lat.textContent);
          const currentLon = parseFloat(lon.textContent);
          
          if (distNode) {
            totalDist = parseFloat(distNode.textContent) / 1000; // 公里
          } else if (list.length > 0) {
            const prev = list[list.length - 1];
            totalDist += getDistKm(prev.lat, prev.lon, currentLat, currentLon);
          }

          // 若 XML 無 Speed 標籤，則利用前後點真實時間差與距離換算
          if (!speedNode && list.length > 0) {
            const prev = list[list.length - 1];
            const dt = (timestamp - prev.timestamp) / 1000;
            const ds = getDistKm(prev.lat, prev.lon, currentLat, currentLon);
            speedVal = (dt > 0) ? (ds / dt) * 3600 : 0;
          }

          list.push({
            lat: currentLat,
            lon: currentLon,
            alt: alt ? Math.round(parseFloat(alt.textContent)) : 0,
            hr: hr ? parseInt(hr.querySelector("Value").textContent, 10) : 0,
            cad: cad ? parseInt(cad.textContent, 10) : 0,
            dist: totalDist,
            speed: Math.min(85, Math.max(0, Math.round(speedVal))), // 正常單車速度過濾
            timestamp: timestamp
          });
        }
      }
      return list;
    }

    function getDistKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function formatDuration(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function updateFrame(idx) {
      if (!trackPoints.length) return;
      const current = trackPoints[idx];
      const activeCoords = trackPoints.slice(0, idx + 1).map(p => [p.lon, p.lat]);

      if (map.getSource('active-route')) {
        map.getSource('active-route').setData({
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: activeCoords }
        });
      }
      if (map.getSource('point-cursor')) {
        map.getSource('point-cursor').setData({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [current.lon, current.lat] }
        });
      }

      // 里程與進度
      const totalDist = trackPoints[trackPoints.length - 1].dist || 1;
      const pct = Math.min(100, Math.round((current.dist / totalDist) * 100));
      document.getElementById('hudDist').innerText = `${current.dist.toFixed(1)} km`;
      document.getElementById('hudPct').innerText = `/ ${totalDist.toFixed(1)} km (${pct}%)`;

      // 經過時間
      if (startTimeEpoch && current.timestamp) {
        const elapsedSec = (current.timestamp - startTimeEpoch) / 1000;
        document.getElementById('hudTime').innerText = `時間: ${formatDuration(elapsedSec)}`;
      }

      // 底部數據卡片
      document.getElementById('valSpeed').innerText = current.speed;
      document.getElementById('valHR').innerText = current.hr || '--';
      document.getElementById('valHR').style.color = (current.hr > 165) ? '#ff4d4f' : '#fff';
      document.getElementById('valElev').innerText = current.alt;
      document.getElementById('valCad').innerText = current.cad || '--';

      // 依勾選狀態顯隱
      const showDist = document.getElementById('showDist').checked;
      const showTime = document.getElementById('showTime').checked;
      document.getElementById('topHud').style.display = (showDist || showTime) ? 'flex' : 'none';
      document.getElementById('distLine').style.display = showDist ? 'flex' : 'none';
      document.getElementById('hudTime').style.display = showTime ? 'block' : 'none';

      document.getElementById('boxSpeed').style.display = document.getElementById('showSpeed').checked ? 'block' : 'none';
      document.getElementById('boxHR').style.display = document.getElementById('showHR').checked ? 'block' : 'none';
      document.getElementById('boxElev').style.display = document.getElementById('showElev').checked ? 'block' : 'none';
      document.getElementById('boxCad').style.display = document.getElementById('showCad').checked ? 'block' : 'none';
    }

    // 勾選變更即刻同步畫面
    document.querySelectorAll('.checkbox-group input').forEach(box => {
      box.addEventListener('change', () => {
        if (trackPoints.length) updateFrame(Math.floor((parseFloat(scrubber.value) / 1000) * (trackPoints.length - 1)));
      });
    });

    function runAnimation(onFinish) {
      if (isPlaying) return;
      isPlaying = true;
      const duration = parseInt(document.getElementById('durationSlider').value, 10) * 1000;
      const start = performance.now();
      const total = trackPoints.length;

      function step(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const idx = Math.floor(progress * (total - 1));

        scrubber.value = Math.floor(progress * 1000);
        scrubberTxt.innerText = `${(progress * 100).toFixed(0)}%`;

        updateFrame(idx);

        if (progress < 1 && isPlaying) {
          animFrame = requestAnimationFrame(step);
        } else {
          isPlaying = false;
          if (onFinish) onFinish();
        }
      }
      animFrame = requestAnimationFrame(step);
    }

    document.getElementById('btnPlay').addEventListener('click', () => {
      if (isPlaying) {
        isPlaying = false;
        cancelAnimationFrame(animFrame);
      } else {
        runAnimation();
      }
    });

    document.getElementById('btnRecord').addEventListener('click', function() {
      const btn = this;
      btn.disabled = true;
      btn.innerText = '錄製中...請稍候';

      const mapCanvas = map.getCanvas();
      const stream = mapCanvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      const chunks = [];

      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ride_story_${Date.now()}.webm`;
        a.click();
        btn.disabled = false;
        btn.innerText = '錄製並下載 IG 限動 (WebM)';
      };

      recorder.start();
      runAnimation(() => recorder.stop());
    });

    document.getElementById('durationSlider').addEventListener('input', e => {
      document.getElementById('durationVal').innerText = e.target.value;
    });
  </script>
</body>
</html>
